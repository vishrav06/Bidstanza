# Project metadata, dependencies and tool configuration for Bidstanza (managed by uv).
# Runtime: FastAPI on Uvicorn, async SQLAlchemy 2.0 over asyncpg, Pydantic v2 for
# validation/settings, PyJWT + pwdlib (argon2) for authentication.
# The `dev` dependency group (pytest, pytest-asyncio, httpx) is installed by `uv sync`
# by default; `uv sync --no-dev` skips it. Exact versions are pinned in uv.lock.
# Note: uvicorn[standard] installs uvloop only on Linux/macOS; on Windows it falls
# back to the default asyncio loop automatically.

[project]
name = "bidstanza"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12",  # required by OAuth2PasswordRequestForm on /auth/login
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
